# KREP-024 Example: Singleton
#
# Demonstrates Graph's flexibility beyond the RGD pattern. A Singleton
# declares a resource that should exist exactly once, with priority-based
# resolution when multiple actors claim the same target.
#
# This is not an RGD — there is no schema, no CRD, no instances. It is
# two Graphs that each want to own the same ConfigMap. The Singleton
# controller (itself a Graph) resolves which one wins based on priority.
#
# 1. Install the CRD and the Graph:
#
#      kubectl apply -f singleton.yaml
#      kubectl wait --for condition=established crd/singletons.kro.run
#
#    The Graph parks on ApplyFailed until step 2.
#
# 2. Grant the impersonated identity (spec.serviceAccountName, in the Graph's
#    OWN namespace) its permissions. Must run AFTER step 1: `--resource=singletons`
#    is resolved through discovery, so the CRD has to exist. The Graph then
#    self-heals.
#
#      kubectl -n kro-system create serviceaccount singleton-controller
#      kubectl create clusterrole singleton-controller \
#        --verb=get,list,watch --resource=singletons \
#        --verb=get,update,patch --resource=singletons/status \
#        --verb=get,list,watch,create,update,patch,delete --resource=configmaps
#      kubectl create clusterrolebinding singleton-controller \
#        --clusterrole=singleton-controller \
#        --serviceaccount=kro-system:singleton-controller
#
#    The configmaps grant is narrow because this example only claims ConfigMaps.
#    A general-purpose Singleton controller would need write access to every
#    Kind its claimants can name.
#
# 3. Create two competing claims:
#
#      kubectl create namespace monitoring
#      kubectl apply -f - <<'EOF'
#      apiVersion: kro.run/v1alpha1
#      kind: Singleton
#      metadata: {name: team-a-dashboard, namespace: kro-system}
#      spec:
#        priority: 100
#        template:
#          apiVersion: v1
#          kind: ConfigMap
#          metadata: {name: webapp-dashboard, namespace: monitoring}
#          data: {dashboard.json: '{ "title": "Team A Dashboard" }'}
#      ---
#      apiVersion: kro.run/v1alpha1
#      kind: Singleton
#      metadata: {name: team-b-dashboard, namespace: kro-system}
#      spec:
#        priority: 200
#        template:
#          apiVersion: v1
#          kind: ConfigMap
#          metadata: {name: webapp-dashboard, namespace: monitoring}
#          data: {dashboard.json: '{ "title": "Team B Dashboard" }'}
#      EOF
#
#      kubectl -n monitoring get cm webapp-dashboard -o yaml   # Team B's content
#      kubectl -n kro-system delete singleton team-b-dashboard
#      kubectl -n monitoring get cm webapp-dashboard -o yaml   # Team A takes over,
#                                                              # same UID
# ---------------------------------------------------------------------------
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: singletons.kro.run
spec:
  group: kro.run
  names:
    plural: singletons
    singular: singleton
    kind: Singleton
    listKind: SingletonList
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                priority:
                  type: integer
                  default: 0
                template:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                active:
                  type: boolean
                claim:
                  type: string
      additionalPrinterColumns:
        - name: Claim
          type: string
          jsonPath: .status.claim
        - name: Priority
          type: integer
          jsonPath: .spec.priority
        - name: Active
          type: boolean
          jsonPath: .status.active
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
---
# ---------------------------------------------------------------------------
# Singleton Controller — the Graph that implements the Singleton Kind.
#
# Fan-in pattern: a single long-lived Graph watches all Singleton CRs,
# groups them by target identity (GVK + namespace + name), picks one
# winner per identity by priority, and owns the target resource directly
# via a forEach template. Status is written back to each Singleton CR.
# ---------------------------------------------------------------------------
apiVersion: kro.run/v1alpha1
kind: Graph
metadata:
  name: singleton
  namespace: kro-system
spec:
  serviceAccountName: singleton-controller
  nodes:
    - id: singletons
      ref:
        apiVersion: kro.run/v1alpha1
        kind: Singleton
        metadata:
          selector: {}

    # Flatten each singleton into {key, name, namespace, priority, creationTimestamp, identity, template}.
    # key = namespace/name composite for cross-namespace uniqueness.
    - id: claims
      forEach:
        - s: ${singletons}
      def:
        key: ${s.metadata.namespace + "/" + s.metadata.name}
        name: ${s.metadata.name}
        namespace: ${s.metadata.namespace}
        priority: ${s.spec.priority}
        creationTimestamp: ${s.metadata.creationTimestamp}
        template: ${s.spec.template}
        identity: >-
          ${s.spec.template.apiVersion
            + (has(s.spec.template.metadata.namespace)
               ? "/namespaces/" + s.spec.template.metadata.namespace
               : "")
            + "/" + s.spec.template.kind
            + "/" + s.spec.template.metadata.name}

    # Apply one target resource per unique identity, using the winner's template.
    # A claim is the winner if its key matches the first entry after sorting
    # by priority desc, creationTimestamp asc.
    - id: targets
      forEach:
        - c: >-
            ${claims.filter(c,
              c.key == claims.filter(x, x.identity == c.identity)
                .sortBy(x, x.creationTimestamp)
                .sortBy(x, -x.priority)[0].key)}
      template:
        apiVersion: ${c.template.apiVersion}
        kind: ${c.template.kind}
        metadata:
          name: ${c.template.metadata.name}
          namespace: ${c.template.metadata.namespace}
        data: ${c.template.data}

    # Status writeback. LIMITATION: patches only claims[0], so one Singleton
    # gets a status. forEach is rejected on patch nodes, so an unbounded
    # fan-out is not expressible. Winner selection above is unaffected.
    # includeWhen guards the claims[0] index against an empty claim set.
    - id: singletonStatus
      includeWhen:
        - ${size(claims) > 0}
      patch:
        apiVersion: kro.run/v1alpha1
        kind: Singleton
        metadata:
          name: ${claims[0].name}
          namespace: ${claims[0].namespace}
        status:
          active: >-
            ${claims[0].key == claims.filter(x, x.identity == claims[0].identity)
              .sortBy(x, x.creationTimestamp)
              .sortBy(x, -x.priority)[0].key}
          claim: "${claims[0].identity}"
