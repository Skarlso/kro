apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kro:controller:check-external-references
  labels:
    rbac.kro.run/aggregate-to-controller: "true"
rules:
  - apiGroups:
      - "kro.run"
    resources:
      - "externalreferencetests"
      - "externalreferencetests/status"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
  - apiGroups:
      - ""
    resources:
      - "configmaps"
    verbs:
      - "create"
      - "get"
      - "list"
      - "watch"
      - "update"
      - "patch"
      - "delete"
---
# kro applies a graph's child resources — and reads external references — while
# impersonating the default ServiceAccount of the instance's namespace. This
# graph reads an externalRef ConfigMap in the "default" namespace, i.e. across
# namespaces, so a namespaced RoleBinding is not enough. A ClusterRoleBinding to
# the system:serviceaccounts group grants the impersonated SA the needed access
# in every namespace (acceptable on this throwaway e2e cluster; production would
# scope this to the specific target namespace).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kro-impersonated-sa:check-external-references
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kro:controller:check-external-references
subjects:
  - kind: Group
    apiGroup: rbac.authorization.k8s.io
    name: system:serviceaccounts
